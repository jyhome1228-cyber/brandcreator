name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Python for share image generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guideline engine regression and SVG XML checks
        run: npm run qa:guidelines

      - name: Generate BRAMER social preview PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow cairosvg
          python scripts/generate-og.py
          test -s public/og-bramer.png

      - name: Build for GitHub Pages
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.BRAMER_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.BRAMER_FIREBASE_API_KEY }}
        run: npx vite build --base=/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
