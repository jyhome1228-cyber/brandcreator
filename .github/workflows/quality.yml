name: GRIBLE quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/industry-guideline-builder]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
