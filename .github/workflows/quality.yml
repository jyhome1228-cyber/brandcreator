name: Bramer quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/industry-guideline-builder]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Phase 1 brand guideline regression QA
        run: npm run qa:guidelines
      - name: Typecheck and production build
        run: npm run build
