name: Bramer quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/industry-guideline-builder]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Phase 1 brand guideline regression QA
        run: npm run qa:guidelines
      - name: Workspace navigation and industry guidance QA
        run: node scripts/qa-workspace.cjs
      - name: Typecheck and production build
        run: npm run build
      - name: Install browser QA runner
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Real-browser workflow and responsive tests
        run: node scripts/qa-browser.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bramer-browser-qa
          path: artifacts/browser-qa/
          retention-days: 7
