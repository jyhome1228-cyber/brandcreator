name: BRAMER Firebase visitor diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - "src/visitorStats.ts"
      - "src/firebaseWebConfig.ts"
      - "firestore.rules"
      - ".github/workflows/firebase-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe active Firebase Auth and Firestore visitor reads
        run: node scripts/firebase-check.mjs
